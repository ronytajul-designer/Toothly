<aside class="palette" aria-label="Palette preview">
    <button class="palette__toggle" type="button" aria-expanded="false" aria-controls="palette-options">
      <span>Palette preview</span>
      <svg aria-hidden="true"><use href="#i-chevron"/></svg>
    </button>
    <fieldset id="palette-options">
      <legend>Temporary tool for choosing the final palette</legend>
      <label><input type="radio" name="palette" value="original"><span>Original (Figma)</span><span class="sw" aria-hidden="true"><i style="background:#C6E3DE"></i><i style="background:#697884"></i><i style="background:#0E2A42"></i></span></label>
      <label><input type="radio" name="palette" value="a"><span>A. Brand-safe fix</span><span class="sw" aria-hidden="true"><i style="background:#C6E3DE"></i><i style="background:#3A7D73"></i><i style="background:#0E2A42"></i></span></label>
      <label><input type="radio" name="palette" value="b"><span>B. Navy CTA</span><span class="sw" aria-hidden="true"><i style="background:#C6E3DE"></i><i style="background:#3A7D73"></i><i style="background:#0E2A42;border-color:#0E2A42"></i></span></label>
      <label><input type="radio" name="palette" value="c"><span>C. Deep teal brand</span><span class="sw" aria-hidden="true"><i style="background:#C6E3DE"></i><i style="background:#2E6E65"></i><i style="background:#0E2A42"></i></span></label>
    </fieldset>
  </aside>
